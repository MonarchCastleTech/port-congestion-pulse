# Port Congestion Pulse Configuration
project:
  id: port-congestion-pulse
  name: "Port Congestion Pulse"
  description: "Real-time global port congestion index."

openrouter:
  model: "z-ai/glm-5.2:free"
  fallback_model: "google/gemma-4-31b-it:free"

gdelt_query: "(congestion OR "supply chain" OR shipping OR freight)"
include_forex: true

sources:
  - name: "GDELT"

refresh:
  interval_hours: 6
  retry_attempts: 3

scoring:
  scale: "1-10"
  thresholds:
    high: 7
    medium: 4
    low: 0
