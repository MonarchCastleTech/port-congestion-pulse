# Port Congestion Pulse Configuration
project:
  id: port-congestion-pulse
  name: "Port Congestion Pulse"
  description: "Real-time global port congestion index."

openrouter:
  model: "nvidia/nemotron-3-super-120b-a12b:free"
  fallback_model: "z-ai/glm-5.2:free"

news_query: "(congestion OR shipping OR freight OR backlog)"
include_forex: true

sources:
  - name: "Google News RSS"

refresh:
  interval_hours: 6
  retry_attempts: 3

scoring:
  scale: "1-10"
  thresholds:
    high: 7
    medium: 4
    low: 0
